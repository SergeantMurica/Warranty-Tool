<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Warranty Upsell Tracker</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <section id="authView" hidden>
      <header class="top"><h1>Warranty tracker</h1></header>
      <form id="authForm" autocomplete="on" novalidate>
        <label class="field" id="nameField" hidden>
          <span>Your name <em>shown on orders</em></span>
          <input
            id="authName"
            type="text"
            autocomplete="name"
            placeholder="e.g. Parker"
          />
        </label>
        <label class="field">
          <span>Email</span>
          <input id="authEmail" type="email" autocomplete="username" />
        </label>
        <label class="field">
          <span>Password</span>
          <input
            id="authPass"
            type="password"
            autocomplete="current-password"
          />
        </label>
        <p class="error" id="authError" role="alert" hidden></p>
        <div class="actions">
          <button type="button" id="authToggle" class="ghost">
            Create account
          </button>
          <button type="submit" id="authSubmit" class="primary">Sign in</button>
        </div>
      </form>
      <div class="theme-row">
        <select class="theme-select" aria-label="Color theme"></select>
      </div>
    </section>

    <section id="mainView" hidden>
      <header class="top">
        <div class="brand-logo-container">
          <img
            class="brand-logo"
            src="icons/icon128.png"
            alt="Warranty Upsell Tracker logo"
          />
        </div>
        <h1>Warranty Upsells Tracker</h1>
        <span class="count"
          ><span id="count">0 logged</span> ·
          <button
            type="button"
            id="signOut"
            class="link"
            title="Sign out"
          ></button
        ></span>
      </header>

      <form id="form" autocomplete="off" novalidate>
        <div class="row">
          <label class="field">
            <span>Order number</span>
            <input id="order" type="text" placeholder="MPC2636599" />
          </label>
          <label class="field">
            <span>Phone <em>optional</em></span>
            <input
              id="phone"
              type="tel"
              inputmode="tel"
              placeholder="(555) 123-4567"
            />
          </label>
        </div>
        <div class="row">
          <label class="field">
            <span>Customer <em>optional</em></span>
            <input id="name" type="text" placeholder="e.g. Parker Smith" />
          </label>
          <label class="field">
            <span>System price <em>optional</em></span>
            <input
              id="systemPrice"
              type="number"
              min="0"
              step="0.01"
              inputmode="decimal"
              placeholder="e.g. 3150"
            />
          </label>
        </div>

        <p class="hint" id="hint" role="status" hidden></p>
        <p class="error" id="error" role="alert" hidden></p>

        <div class="actions">
          <button type="button" id="clear" class="ghost" hidden>Clear</button>
          <button type="submit" class="primary">Log contact</button>
        </div>
      </form>

      <p class="hint" id="scriptHint" role="status" hidden></p>

      <section class="log">
        <div class="tabs" id="tabs" role="tablist" aria-label="Filter"></div>
        <input
          id="search"
          type="search"
          placeholder="Search order, phone, customer or teammate"
        />
        <div class="scroll" id="scroll">
          <div id="list"></div>
          <p class="empty" id="empty">Nothing logged yet.</p>
        </div>
        <footer class="foot">
          <select class="theme-select" aria-label="Color theme"></select>
          <button type="button" id="export" class="link">Export CSV</button>
        </footer>
      </section>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
